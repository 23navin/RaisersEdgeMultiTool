openapi: 3.0.1
info:
  title: Membership
  description: This API manages membership information.
  version: '1.0'
servers:
  - url: https://api.sky.blackbaud.com/membership
paths:
  '/v1/constituents/{constituent_id}/membership':
    post:
      tags:
        - Constituent
      summary: Add membership endpoint
      description: Creates a membership endpoint.
      operationId: CreateMembership
      parameters:
        - name: constituent_id
          in: path
          description: The Constituent ID
          required: true
          schema:
            type: string
      requestBody:
        description: Membership
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipCreate'
            example:
              membership_id: '12'
              dues: 77.09
              program:
                legacy_id: '1561'
                value: Education Programme
              reason:
                legacy_id: '1331'
                value: Moved
              subcategory:
                legacy_id: 56
                value: Animals in the Wild
              category:
                legacy_id: 22
                value: family
              joined_date: '2024-01-20'
              lifetime_membership: false
              expires_on_date: '2025-12-20'
              print_renewals: true
              mem_comment: Created Membership for the Young Explorer group.
              total_members: 1
              total_children: 0
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the new member junction ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '120'
        '401':
          description: Returned when the user does not have permission to execute this operation.
        '403':
          description: Returned when the constituent add membership capability is not enabled.
  /v1/memberships/categories:
    get:
      tags:
        - Membership Categories
      summary: Get membership category list
      description: Returns a membership category list.
      operationId: GetMembershipCategoriesAsync
      parameters:
        - name: include_inactive
          in: query
          description: Indicates whether to include inactive membership category and subcategory.
          schema:
            type: boolean
        - name: search
          in: query
          description: Text to find at least partially in membership.
          schema:
            type: string
        - name: sort_by
          in: query
          description: Sort column
          schema:
            $ref: '#/components/schemas/MembershipCategorySortFields'
        - name: sort_direction
          in: query
          description: 'Use ''asc'' or ''dsc'' to arrange a grid, list, or repeater in ascending or descending order based on the passed value for sorting.'
          schema:
            $ref: '#/components/schemas/SortDirection'
        - name: limit
          in: query
          description: Represents the number of records to return. The default is 500.
          schema:
            maximum: 10000.0
            minimum: 1.0
            type: integer
            format: int32
            default: 500
        - name: offset
          in: query
          description: Represents the number of records to skip. For use with pagination.
          schema:
            maximum: 2147483647.0
            minimum: 0.0
            type: integer
            format: int32
            default: 0
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the membership category list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipCategoryCollection'
              example:
                categories:
                  - membership_category_id: 1
                    category_name: Category name one
                    default_expires_date: '2023-12-20'
                    program_name: Program name one
                    sequence: 1
                    inactive: false
                    lifetime_membership: true
                    print_renewals: true
                    default_expires_days: 5
                    new_mem_expires_value: 2
                    new_mem_expires_interval: Years
                    maximum_members: 5
                    benefit_notes: Benefit notes one
                    send_benefits_to: PrimaryMember
                    minimum_dues: 50
                    maximum_dues: 100
                    dues_level: '40'
                  - membership_category_id: 2
                    category_name: Category name two
                    program_name: Program name two
                    sequence: 2
                    inactive: true
                    lifetime_membership: false
                    print_renewals: true
                    default_expires_days: 5
                    new_mem_expires_value: 2
                    new_mem_expires_interval: Years
                    maximum_members: 2
                    benefit_notes: Benefit notes two
                    send_benefits_to: Donor
                    minimum_dues: 33.33
                    maximum_dues: 99.99
                    dues_level: '40'
                count: 2
                offset: 1
                limit: 10
        '401':
          description: Returned when the user does not have permission to execute this operation or does not have permission to view the requested constituents membership category list.
        '403':
          description: Returned when the constituent membership category capability is not enabled.
  '/v1/memberships/categories/{membership_category_id}/subcategories':
    get:
      tags:
        - Membership Categories
      summary: Get membership subcategory list based on category.
      description: Returns a list of membership subcategories by category ID.
      operationId: GetMembershipSubCategoriesByCategoryIdAsync
      parameters:
        - name: membership_category_id
          in: path
          description: The membership category ID.
          required: true
          schema:
            type: string
        - name: search
          in: query
          description: Text to find at least partially in membership.
          schema:
            type: string
        - name: sort_direction
          in: query
          description: 'Use ''asc'' or ''dsc'' to arrange a grid, list, or repeater in ascending or descending order based on the passed value for sorting.'
          schema:
            $ref: '#/components/schemas/SortDirection'
        - name: limit
          in: query
          description: Represents the number of records to return. The default is 500.
          schema:
            maximum: 10000.0
            minimum: 1.0
            type: integer
            format: int32
            default: 500
        - name: offset
          in: query
          description: Represents the number of records to skip. For use with pagination.
          schema:
            maximum: 2147483647.0
            minimum: 0.0
            type: integer
            format: int32
            default: 0
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the list of membership subcategories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipSubCategoryCollection'
              example:
                sub_categories:
                  - membership_subcategories_id: '1'
                    membership_catgory_id: '1'
                    sequence: 1
                    membership_sub_category_name: Membership sub category one
                  - membership_subcategories_id: '2'
                    membership_catgory_id: '1'
                    sequence: 2
                    membership_sub_category_name: Membership sub category two
                count: 2
                offset: 1
                limit: 10
        '401':
          description: Returned when the user does not have permission to execute this operation or does not have permission to view the requested constituents membership subcategory list.
        '403':
          description: Returned when the constituent membership subcategory capability is not enabled.
  '/v1/memberships/{member_junction_id}/membershipsummary':
    get:
      tags:
        - Membership
      summary: Get membership summary based on membership
      description: Returned membership summary by member junction ID
      operationId: GetMembershipSummaryByMemberJunctionIdAsync
      parameters:
        - name: member_junction_id
          in: path
          description: Member junction ID.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains membership summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipSummary'
              example:
                custom_membership_id: '123456789'
                notes: Membership summary
                standing: Active
                constituent_id: '1'
                constituent_name: Doug Hall
                expires_on_date: '2023-12-20'
                primary_member_constituent_id: '2'
                primary_member_constituent_name: George Smith
                primary: true
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
        '403':
          description: Returned when the user does not have permission to view memberships.
        '400':
          description: Returned when the specified member junction ID in the request URL is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: Field is required
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified membership is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
  '/v1/memberships/{member_junction_id}/membershipdetails':
    get:
      tags:
