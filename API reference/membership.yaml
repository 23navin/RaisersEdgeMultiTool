      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains membership details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipDetails'
              example:
                dues: 11
                category_name: Category name
                program_name: Program name
                sub_category_name: Sub category name
                last_renewed_date: '2023-12-06'
                last_dropped_date: '2022-12-20'
                next_renewal_date: '2024-12-06'
                joined_date: '2023-12-26'
                total_years: 2
                times_renewed: 1
                consec_years: 1
                type: Renewal
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
        '403':
          description: Returned when the user does not have permission to view memberships.
        '400':
          description: Returned when the specified member junction ID in the request URL is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
