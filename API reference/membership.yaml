                      - gift_id: '2029'
                        applied_amount: 33
                  - id: '2'
                    category_name: Category name two
                    program_name: Program name two
                    sub_category_name: Sub category name two
                    activity_date: '2023-12-20'
                    type: Dropped
                count: 2
                offset: 0
                limit: 10
        '401':
          description: Returned when the user does not have permission to execute this operation or does not have permission to view the requested constituents membership history list.
        '403':
