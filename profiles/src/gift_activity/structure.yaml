id: gift_activity
name: "Gift Activity Report"
kind: report
version: "1.0"
min_app_version: "0.2.0"

# ── 1) Parameters ─────────────────────────────────────────────────────────────
# UI inputs, rendered in the Inputs panel (kept separate from visualizations).
parameters:
  - id: gift_dates
    label: "Gift Date Range"
    type: date_range            # date | date_range | select | text | number
    required: true
    default:
      preset: last_30_days

# ── 2) Queries ────────────────────────────────────────────────────────────────
# Parameterized RE API calls. `ref` selects the central registry call
# (re.query.execute handles the SKY execute → poll job → download flow). The
# `template` is an ExecuteQueryDefinition — see "API reference/query.yaml" —
# which the backend nests under `query` in the ExecuteQueryRequest envelope and
# fills with ux_mode / output_format / formatting_mode defaults. {{param:...}}
# placeholders are substituted before sending. `output` names the JSON result
# that transforms read via {{query:...}}.
#
# ⚠ REPLACE THE FIELD IDs BELOW. RE addresses fields by numeric query_field_id,
# and the ids differ per environment. Discover yours with:
#   GET /query/querytypes?product=RE&module=None            → find the type_id
#   GET /query/v2/queryfields/root?product=RE&module=None&query_type_id=<id>
#   GET /query/v2/queryfields/node?...                      → drill into nodes
# `user_alias` renames each column in the results — keep these aliases matching
# the column names sql/constituent_gifts.sql selects (constituent_name,
# gift_id, gift_amount, gift_date), and the transform keeps working unchanged.
# The mock path ignores `template` entirely and reads fixtures/GiftRows.json.
queries:
  - id: gift_rows
    ref: re.query.execute
    template:
      type_id: 18                       # 18 = Constituent in the spec's examples
      sql_generation_mode: Query
      result_layout: MultiRow
      suppress_duplicates: true
      select_fields:
        - { query_field_id: 597,   user_alias: constituent_name }
        - { query_field_id: 8467,  user_alias: gift_id }
        - { query_field_id: 8469,  user_alias: gift_amount }
        - { query_field_id: 8471,  user_alias: gift_date }
      filter_fields:
        - query_field_id: 8471            # gift date
          compare_type: None
          operator: Between
          filter_values:
            - "{{param:gift_dates.from}}"
            - "{{param:gift_dates.to}}"
          left_parenthesis: false
          right_parenthesis: false
      sort_fields:
        - { query_field_id: 8471, sort_order: Descending }
    output: GiftRows

# ── 3) Transforms ─────────────────────────────────────────────────────────────
# DuckDB SQL over query outputs. `input` lists query output labels (resolved to
# {{query:Label}} JSON paths in the SQL). `output` is the in-memory result set a
# visualization binds to.
transforms:
  - id: constituent_gifts
    input:
      - GiftRows
    sql: constituent_gifts.sql
    output: ConstituentGifts

# ── 4) Visualizations ─────────────────────────────────────────────────────────
# Reference the shared viz library by `type`, bound to a transform output.
visualizations:
  - id: gifts_table
    type: table                 # table | bar | line | pie | kpi
    title: "Constituents & Gifts"
    data: ConstituentGifts
    config:
      sortable: true
      columns:
        - { field: constituent_name, header: "Constituent" }
        - { field: gift_amount, header: "Amount", format: currency }
        - { field: gift_date, header: "Date", format: date }

# ── 5) Actions ────────────────────────────────────────────────────────────────
# On-demand write-backs (not part of Refresh). Resolve through the API library.
actions:
  - id: save_re_query
    label: "Create Query in RE"
    ref: re.query.create        # creates/saves a query in the RE CRM
    input: ConstituentGifts     # source rows
    bind:
      name: "Report Gifts {{now}}"
      id_field: gift_id         # which result column supplies the Gift IDs
      # RE static queries are criteria, not id lists, so the collected ids are
      # sent as a single OneOf filter. Both ids are environment-specific —
      # discover them the same way as the query template's fields above.
      type_id: 18               # query type the saved query is created under
      id_query_field_id: 8467   # the query field `id_field` values belong to
