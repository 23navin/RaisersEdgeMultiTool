---
id: test2
name: Multi-File Vendor Import
version: 2.0.0
min_app_version: 0.1.0

inputs:
  - label: Inventory
    type: csv
    required: true
    validation:
      - label: Item #
        required: true
        type: number
        digits: 6

      - label: Category
        required: true
        type: string
        value:
          - Alpha
          - Beta
          - Gamma

  - label: Pricing
    type: xlsx
    required: true
    validation:
      - label: SKU
        required: true
        type: string

      - label: Price
        required: true
        type: number

  - label: Categories
    type: csv
    required: false

outputs:
  - label: Inventory_Import
    type: csv

  - label: Pricing_Update
    type: csv

  - label: Audit_Log
    type: csv

steps:
  - label: UploadVendorX
    type: file_input
    input:
      - label: Inventory
        validate: true
      - label: Categories
        validate: false

  - label: UploadPricing
    type: file_input
    input:
      - label: Pricing
        validate: true

  - label: BuildOutputs
    type: sql_transform
    transforms:
      - input:
          - Inventory
          - Categories
        sql: inventory.sql
        output:
          - Inventory_Import

      - input:
          - Pricing
        sql: pricing.sql
        output:
          - Pricing_Update

      - input:
          - Categories
          - Pricing
        sql: audit.sql
        output:
          - Audit_Log

  - label: ImportFiles
    type: manual_instruction
