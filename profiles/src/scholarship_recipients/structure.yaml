---
id: scholarship_recipients
name: Scholarship Recipients
version: 1.0.0
min_app_version: 0.2.0

# Turns a foundation scholarship award list into an RE gift/award import file.
#
# The shape of the run:
#   upload ─▶ ask RE for every fund id ─▶ show the projects that match nothing
#          ─▶ ask the operator for each term's start and end date
#          ─▶ write the import file for the rows that matched
#
# Rows whose Foundation Project isn't a fund in RE are reported once and then
# dropped: every later step joins on the fund, so they simply stop travelling.

inputs:
  - label: Recipients
    type: xlsx
    required: true
    # The award list as the foundation sends it. Several headers are two-line
    # cells in the source workbook ("Bronco" / "ID", "Award" / "QTR/YR"), but
    # the labels below name them the way they read on screen: the harness
    # flattens every header's line breaks before the rules are applied.
    validation:
      - label: "Bronco ID"
        required: true
        type: number
      - label: "Award QTR/YR"
        required: true
        type: string
      - label: Foundation Project
        required: true
        type: string
      - label: Project Title
        required: true
        type: string
      - label: Amount
        required: true
        type: number

outputs:
  - label: Import_File
    type: csv

steps:
  - label: AddSourceFile
    type: file_input
    input:
      - label: Recipients
        validate: true

  # ── Every fund in RE ────────────────────────────────────────────────────────
  # A static query — no params_sql, because the step asks for the whole fund
  # list rather than looking up the ids in the file. The match then happens
  # locally in SQL, which also lets the next step show what *didn't* match.
  #
  # ⚠ DRAFT: type_id and the query_field_id values below are placeholders from
  # the SKY spec's own examples. Replace them with this environment's —
  # discover them with GET /query/querytypes and
  # GET /query/v2/queryfields/root. Keep the `user_alias` names (fund_id,
  # fund_description): every SQL file here selects by those aliases.
  # Mock mode ignores `template` entirely and reads
  # fixtures/queries/Funds.json, so the profile runs end to end offline.
  - label: FetchFunds
    type: re_query
    ref: re.query.execute
    query_output: Funds
    template:
      type_id: 20
      sql_generation_mode: Query
      result_layout: MultiRow
      select_fields:
        - { query_field_id: 1001, user_alias: fund_id }
        - { query_field_id: 1002, user_alias: fund_description }

  # ── What won't import, and what to do about it ──────────────────────────────
  # One row per Foundation Project the upload carries that isn't a fund id in
  # RE, shown with its project title and how many award rows ride on it. Each
  # gets a dropdown of every fund RE returned, so a project that is really a
  # known fund under another name can be pointed at it rather than dropped.
  #
  # `options_sql` is what makes the dropdown possible: the choices don't exist
  # until FetchFunds has run, so they can't be a fixed list in this file. The
  # field is optional — a project left unmapped is simply excluded, which is
  # the old behaviour and still the right answer for a genuinely unknown fund.
  - label: FundOverrides
    type: user_input
    input:
      - Recipients
    query_input:
      - Funds
    rows_sql: unmatched_projects.sql
    key_column: "Foundation Project"
    fields:
      - id: replacement_fund_id
        label: "Use this fund instead"
        type: select
        options_sql: fund_choices.sql
    form_output: FundOverrides

  # ── The dates the file doesn't carry ────────────────────────────────────────
  # rows_sql returns one row per term still in play (F25, SP26, …) — read off
  # the upload, for rows that resolve to a fund either directly or through the
  # mapping above. Hence `form_input: [FundOverrides]`: mapping a project can
  # bring a new term into play, and the date boxes are required, so asking
  # about a term that can never import would block the run.
  - label: SemesterDates
    type: user_input
    input:
      - Recipients
    query_input:
      - Funds
    form_input:
      - FundOverrides
    rows_sql: semester_terms.sql
    key_column: term
    fields:
      - id: date_from
        label: Start date
        type: date
        required: true
      - id: date_to
        label: End date
        type: date
        required: true
    form_output: SemesterDates

  # ── The import file ─────────────────────────────────────────────────────────
  # Joins everything: the upload, the fund list, the project→fund mapping, and
  # the dates just collected. A row that resolves to no fund, or whose term has
  # no dates, is absent from the output — the notice below says which and why.
  - label: CreateImportFile
    type: sql_transform
    input:
      - Recipients
    query_input:
      - Funds
    form_input:
      - FundOverrides
      - SemesterDates
    sql: build_import.sql
    output:
      - Import_File
    notices:
      - label: "Rows left out of the import file"
        sql: excluded_rows.sql
        description: >
          These award rows are not in the file above. Either the Foundation
          Project isn't a fund in RE and no replacement was chosen for it, or
          the term has no dates filled in yet. Pick a fund, fill in the missing
          dates, and generate again; take anything genuinely unknown back to
          the foundation.

  - label: Import
    type: manual_instruction
