# Local/simple deployment: one service, one volume. Put the RE NXT service
# account in a .env file next to this (RE_CLIENT_ID=..., etc.) or leave it
# out to run in mock mode.
services:
  multitool:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - multitool-data:/data
    environment:
      # Optional. Leave these unset and connect through the app's
      # Settings → General panel instead — the normal path.
      # PUBLIC_URL must be set to the externally reachable base URL whenever
      # the app is behind a proxy, or the OAuth redirect_uri will be wrong.
      PUBLIC_URL: ${PUBLIC_URL:-}
      RE_CLIENT_ID: ${RE_CLIENT_ID:-}
      RE_CLIENT_SECRET: ${RE_CLIENT_SECRET:-}
      RE_SUBSCRIPTION_KEY: ${RE_SUBSCRIPTION_KEY:-}
      RE_REFRESH_TOKEN: ${RE_REFRESH_TOKEN:-}
      RE_NXT_MOCK: ${RE_NXT_MOCK:-}
      MAX_RUNS: ${MAX_RUNS:-4}
    restart: unless-stopped

volumes:
  multitool-data:
