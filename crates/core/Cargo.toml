# The framework-neutral engine: profile bundles, DuckDB transforms, validation,
# and the SKY API call layer. No Tauri, no HTTP server — both shells depend on it.
[package]
name = "multitool-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "multitool_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
duckdb = { version = "1", features = ["bundled"] }
zip = "2"
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
