# The web shell: an Axum server exposing every core::api operation as
# POST /api/<command>, plus the web-shaped endpoints the browser needs —
# multipart input upload, artifact download, and session asset serving.
# Serves the Vite dist/ as the SPA.
[package]
name = "multitool-server"
version = "0.1.0"
edition = "2021"

[dependencies]
multitool-core = { path = "../core" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
